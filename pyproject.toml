[project]
name = "ai-employee-gold"
version = "1.0.0"
description = "Personal AI Employee - Gold Tier Implementation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core dependencies
    "watchdog>=4.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    
    # Google APIs (Gmail, Calendar)
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.1.0",
    
    # Social Media (optional)
    "tweepy>=4.14.0",
    
    # Accounting/Odoo integration
    "xmlrpc-client>=1.0.1",
    
    # Data processing
    "python-dateutil>=2.8.2",
    
    # Testing
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
social = [
    "tweepy>=4.14.0",
    "facebook-sdk>=3.1.0",
]
accounting = [
    "xmlrpc-client>=1.0.1",
]

[project.scripts]
ai-employee = "run:main"
start-watchers = "watchers.filesystem_watcher:main"
run-orchestrator = "orchestrator:main"
ralph-loop = "modules.planning.ralph_loop:main"
planner-agent = "modules.planning.planner_agent:main"
task-executor = "modules.planning.task_executor:main"
ceo-briefing = "modules.reporting.ceo_briefing:main"
weekly-audit = "modules.reporting.weekly_audit:main"
social-scheduler = "modules.social.social_scheduler:main"
social-summary = "modules.social.social_summary:main"
invoice-sync = "modules.accounting.invoice_sync:main"
accounting-audit = "modules.accounting.accounting_audit:main"
audit-logger = "utils.audit_logger:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules", "utils", "watchers"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
